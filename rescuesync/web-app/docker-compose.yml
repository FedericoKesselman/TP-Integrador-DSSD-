services:
  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      BONITA_API_URL: http://host.docker.internal:8080/bonita

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rescuesync}
      POSTGRES_USER: ${DB_USER:-rescuesync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
