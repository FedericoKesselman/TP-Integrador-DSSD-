services:
  server:
    build:
      # Contexto = web-app/ (no ./server) para que el Dockerfile pueda
      # copiar también web-app/shared/ dentro de la imagen — ver el
      # comentario en server/Dockerfile.
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules
      # La imagen ya trae web-app/shared/ copiada (ver Dockerfile); este
      # bind mount es solo para desarrollo, así un cambio en shared/ se ve
      # al instante sin rebuildear la imagen (mismo motivo que ./server:/app
      # de arriba).
      - ./shared:/shared:ro
    environment:
      BONITA_API_URL: http://host.docker.internal:8080/bonita
      BONITA_PROCESS_NAME: ${BONITA_PROCESS_NAME:-Gestionar Emergencia}
      BONITA_USERNAME: ${BONITA_USERNAME:-OperadorM}
      BONITA_PASSWORD: ${BONITA_PASSWORD:-changeme}
      # Dentro de la red de Docker Compose, Postgres se resuelve por el
      # nombre del servicio ("postgres"), no por "localhost" (eso es lo
      # que queda en server/.env, para cuando se corre algo fuera de
      # Docker, como las migraciones desde la terminal). Sin esta línea
      # el server intenta conectarse a sí mismo y falla con ECONNREFUSED.
      DATABASE_URL: postgresql://${DB_USER:-rescuesync}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-rescuesync}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-rescuesync}
      POSTGRES_USER: ${DB_USER:-rescuesync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
